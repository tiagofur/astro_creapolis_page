name: Deploy Creapolis (frontend + backend)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite deploy manual desde GitHub UI

env:
  REGISTRY: ghcr.io
  # image name = <owner>/<repo>/backend ; lowercased later
  IMAGE_REPO: ${{ github.repository }}/backend

jobs:
  # ------------------------------------------------------------------
  # 1) Build Astro and rsync the static dist/ to Plesk docroot
  # ------------------------------------------------------------------
  deploy-frontend:
    name: Build & rsync Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creapolis/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: creapolis

      - name: Build Astro site
        run: npm run build
        working-directory: creapolis

      - name: Deploy Astro dist to VPS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: creapolis/dist/
          remote_path: ${{ secrets.VPS_DEPLOY_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

  # ------------------------------------------------------------------
  # 2) Build Go backend Docker image and push it to GHCR
  # ------------------------------------------------------------------
  build-backend-image:
    name: Build & push backend image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./creapolis/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 3) SSH into VPS and roll the backend container to the new image
  # ------------------------------------------------------------------
  deploy-backend:
    name: Pull image on VPS and restart container
    needs: build-backend-image
    runs-on: ubuntu-latest
    steps:
      - name: Roll backend container on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # envs injects variables into the remote shell (whitelisted by appleboy/ssh-action)
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script_stop: true
          script: |
            set -euo pipefail

            # Log in to GHCR on the VPS so docker pull can fetch the (private) image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull the newly built image
            docker pull "$IMAGE:latest"

            # Recreate the container (idempotent)
            docker stop creapolis-api 2>/dev/null || true
            docker rm   creapolis-api 2>/dev/null || true

            # Env file lives on the VPS (out of the repo); keeps secrets off the CLI
            # Expected vars inside /etc/creapolis/backend.env:
            #   PORT, DATABASE_URL, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, NOTIFY_EMAIL
            docker run -d \
              --name creapolis-api \
              --restart unless-stopped \
              --env-file /etc/creapolis/backend.env \
              -p 127.0.0.1:3100:3000 \
              "$IMAGE:latest"

            # Keep disk usage sane
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ${{ needs.build-backend-image.outputs.image }}
