<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://creapolis.dev/es/">
  <noscript>
    <meta http-equiv="refresh" content="0;url=/es/">
  </noscript>
  <script>
    (function(){
      var lang='en';
      var p=(navigator.language||navigator.userLanguage||'en').toLowerCase();
      if(p.indexOf('es')===0||p.indexOf('pt')===0)lang='es';
      location.replace('/'+lang+'/');
    })();
  </script>
  <title>Creapolis</title>
</head>
<body>
  <p>Redirecting to <a href="/es/">Creapolis</a>...</p>
</body>
</html>
